<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>스트리밍 만료일 검색기</title>
    <style>
        .movie-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 8px; }
        .streaming-results { margin-top: 10px; padding: 10px; background: #f9f9f9; border-radius: 5px; }
        .expire-warning { color: red; font-weight: bold; }
        .badge.subscription {
            background-color: #1db954;
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            margin-right: 8px;
            font-weight: bold;
        }
        .badge.rent {
            background-color: #f39c12;
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            margin-right: 8px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .badge.buy {
            background-color: #e74c3c;
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            margin-right: 8px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>
    <h2>어디서 볼 수 있지? (만료일 확인)</h2>
    <input type="text" id="searchInput" placeholder="영화나 TV 시리즈 제목">
    <button onclick="searchMovies()">검색</button>

    <!-- 검색 결과가 여기에 그려집니다 -->
    <div id="resultsList" style="margin-top: 20px;"></div>

    <script>
        // 1. 영화 검색 함수
        async function searchMovies() {
            const query = document.getElementById('searchInput').value;
            if (!query) return alert("검색어를 입력하세요!");

            const resultDiv = document.getElementById('resultsList');
            resultDiv.innerHTML = "검색 중...";

            const response = await fetch(`/contents/tmdb_search/?query=${query}`);
            const data = await response.json();
            
            resultDiv.innerHTML = ""; // 초기화

            if (data.results.length === 0) {
                resultDiv.innerHTML = "결과가 없습니다.";
                return;
            }

            data.results.forEach(movie => {
                const card = document.createElement('div');
                card.className = "movie-card";
                card.innerHTML = `
                    <h3>${movie.title} (${movie.release_date || '날짜미상'})</h3>
                    <button onclick="checkStreaming('${movie.tmdb_id}', '${movie.media_type}', this)">
                        스트리밍 및 만료일 확인하기
                    </button>
                    <!-- 스트리밍 정보가 들어갈 공간 -->
                    <div class="streaming-results" style="display: none;"></div>
                `;
                resultDiv.appendChild(card);
            });
        }

        // 2. 스트리밍 정보 가져오는 함수
        async function checkStreaming(tmdbId, mediaType, btnElement) {
            const resultBox = btnElement.nextElementSibling;
            resultBox.style.display = "block";
            resultBox.innerHTML = "스트리밍 정보를 불러오는 중입니다...";

            const response = await fetch(`/contents/streaming_info/?tmdb_id=${tmdbId}&media_type=${mediaType}`);
            const data = await response.json();

            console.log(JSON.stringify(data, null, 2));

            if (!data.providers || data.providers.length === 0) {
                resultBox.innerHTML = "<p>현재 한국에서 시청 가능한 곳이 없습니다.</p>";
                return;
            }
            const priority = {
                subscription: 0,
                free: 1,
                ads: 2,
                rent: 3,
                buy: 4
            };

            data.providers.sort(
                (a, b) => priority[a.type] - priority[b.type]
            );

            let html = "<ul>";
            data.providers.forEach(p => { 
                let badge = ''; 
                let typeText;
                
                if (p.type === 'subscription') { 
                    badge = `<span class="badge subscription">Watch Now</span>`; 
                } 

                switch (p.type) { 
                    case 'subscription': typeText = '구독'; break; 
                    case 'rent':         typeText = '대여'; break; 
                    case 'buy':          typeText = '구매'; break; 
                    case 'free':         typeText = '무료'; break; 
                    default:             typeText = '기타'; 
                } 

                let expireText = p.expires_on 
                    ? `<span class="expire-warning">(종료 예정일: ${p.expires_on})</span>` 
                    : '<span style="color: green;">(안전)</span>';
                
                let actionBtn = '';
                if (p.type === 'subscription') {
                    actionBtn = `<a href="${p.link}" target="_blank" class="badge subscription">Watch Now</a>`;
                } else if (p.type === 'rent') {
                    actionBtn = `<a href="${p.link}" target="_blank" class="badge rent">대여하기</a>`;
                } else if (p.type === 'buy') {
                    actionBtn = `<a href="${p.link}" target="_blank" class="badge buy">구매하기</a>`;
                } else {
                    actionBtn = `<a href="${p.link}" target="_blank">보러가기</a>`;
                }

                html += `
                        <li>
                            <div class="provider-item">
                                ${actionBtn}
                                <strong>${p.service}</strong> [${typeText}] ${expireText}
                            </div>
                        </li>
                    `;
                }); // forEach 끝

                html += "</ul>";
                resultBox.innerHTML = html;
            } // checkStreaming 함수 끝
    </script>
</body>
</html>
