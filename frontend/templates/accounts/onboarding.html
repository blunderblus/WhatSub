<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구독 추가 · WhatSub</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            background: #f5f7f9; color: #17202a;
            font-family: "Pretendard", "Segoe UI", system-ui, sans-serif;
        }
        .wrap { width: min(760px, calc(100% - 32px)); padding: 40px 0; }
        .eyebrow { margin: 0 0 6px; color: #5e6d7a; font-size: 13px; font-weight: 800; text-transform: uppercase; }
        h1 { margin: 0 0 8px; font-size: 34px; color: #111820; }
        .lead { margin: 0 0 28px; color: #687785; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .opt {
            display: block; padding: 24px; border: 1px solid #dce3e9; border-radius: 14px;
            background: #fff; text-decoration: none; color: inherit;
            box-shadow: 0 10px 28px rgba(27, 39, 51, 0.06); transition: border-color 160ms, transform 160ms;
        }
        .opt:hover { border-color: #2f6f73; transform: translateY(-2px); }
        .opt .icon { font-size: 30px; }
        .opt h2 { margin: 12px 0 6px; font-size: 19px; color: #17202a; }
        .opt p { margin: 0; color: #687785; font-size: 14px; line-height: 1.5; }
        .skip { margin-top: 24px; text-align: center; }
        .skip a { color: #2f6f73; font-weight: 700; text-decoration: none; }
        @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <main class="wrap">
        <p class="eyebrow">Onboarding</p>
        <h1>구독을 어떻게 추가할까요?</h1>
        <p class="lead">Gmail에서 자동으로 찾거나, 직접 입력할 수 있어요.</p>

        <div class="grid">
            <a class="opt" href="{% url 'accounts:gmail_scan' %}">
                <div class="icon">📨</div>
                <h2>Gmail로 자동 찾기</h2>
                <p>받은편지함의 결제·구독 메일을 분석해 구독을 자동으로 찾아드립니다.</p>
            </a>
            <a class="opt" href="{% url 'accounts:manual_add' %}">
                <div class="icon">✍️</div>
                <h2>직접 추가하기</h2>
                <p>플랫폼과 플랜을 선택해 구독 정보를 직접 입력합니다.</p>
            </a>
        </div>

        <p class="skip"><a href="{% url 'accounts:profile' %}">나중에 하기 →</a></p>
    </main>
</body>
</html>
