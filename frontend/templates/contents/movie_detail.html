<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ content_label }} 상세</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f7f9;
            color: #17202a;
            font-family: "Pretendard", "Segoe UI", system-ui, sans-serif;
        }

        a {
            color: inherit;
        }

        .page {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
            padding: 24px 0 52px;
            transition: filter 160ms ease;
        }

        .nav-toggle {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .nav-open,
        .nav-backdrop {
            display: none;
        }

        .side-nav {
            position: fixed;
            top: 28px;
            left: 24px;
            display: grid;
            gap: 8px;
            width: 136px;
            padding: 12px;
            border: 1px solid #dce3e9;
            border-radius: 8px;
            background: #ffffff;
            box-shadow: 0 12px 32px rgba(27, 39, 51, 0.12);
            z-index: 10;
        }

        .side-nav a {
            padding: 10px 12px;
            border: 1px solid #c8d1da;
            border-radius: 8px;
            background: #ffffff;
            color: #26323d;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 8px 24px rgba(27, 39, 51, 0.06);
        }

        .side-nav a.active {
            border-color: #2f6f73;
            background: #2f6f73;
            color: #ffffff;
        }

        @media (max-width: 1549px) {
            .nav-open {
                position: fixed;
                top: 16px;
                left: 16px;
                z-index: 13;
                display: grid;
                place-items: center;
                width: 44px;
                height: 44px;
                border: 1px solid #c8d1da;
                border-radius: 8px;
                background: #ffffff;
                color: #26323d;
                font-size: 22px;
                font-weight: 800;
                cursor: pointer;
                box-shadow: 0 10px 28px rgba(27, 39, 51, 0.14);
            }

            .side-nav {
                top: 0;
                left: 0;
                width: min(280px, calc(100vw - 48px));
                height: 100vh;
                align-content: start;
                padding: 72px 18px 18px;
                border-radius: 0;
                transform: translateX(-110%);
                transition: transform 180ms ease;
                z-index: 14;
            }

            .nav-backdrop {
                position: fixed;
                inset: 0;
                z-index: 12;
                background: rgba(17, 24, 32, 0.34);
                backdrop-filter: blur(4px);
                cursor: pointer;
            }

            .nav-toggle:checked ~ .side-nav {
                transform: translateX(0);
            }

            .nav-toggle:checked ~ .nav-backdrop {
                display: block;
            }

            .nav-toggle:checked ~ .page {
                filter: blur(2px);
            }
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            min-height: 38px;
            margin-bottom: 18px;
            color: #2f6f73;
            font-weight: 700;
            text-decoration: none;
        }

        .notice,
        .loader {
            padding: 18px;
            border: 1px solid #d7b7a3;
            border-radius: 8px;
            background: #fff4ec;
            color: #7b3d1c;
        }

        .hero {
            display: grid;
            grid-template-columns: minmax(220px, 310px) minmax(0, 1fr);
            gap: 28px;
            align-items: end;
            min-height: 440px;
            padding: 28px;
            border-radius: 8px;
            overflow: hidden;
            background: #17202a;
            color: #ffffff;
            position: relative;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: linear-gradient(90deg, rgba(17, 24, 32, 0.94), rgba(17, 24, 32, 0.72), rgba(17, 24, 32, 0.5)), var(--backdrop);
            background-size: cover;
            background-position: center;
        }

        .poster,
        .poster-empty,
        .hero-content {
            position: relative;
            z-index: 1;
        }

        .poster,
        .poster-empty {
            width: 100%;
            aspect-ratio: 2 / 3;
            border-radius: 8px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
        }

        .poster {
            display: block;
            object-fit: cover;
        }

        .poster-empty {
            display: grid;
            place-items: center;
            padding: 18px;
            background: #dfe7ec;
            color: #44515e;
            text-align: center;
            font-weight: 700;
        }

        .hero-content {
            display: grid;
            gap: 14px;
        }

        h1 {
            margin: 0;
            font-size: 44px;
            line-height: 1.08;
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .pill {
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.13);
            font-size: 13px;
            font-weight: 700;
        }

        .overview {
            max-width: 760px;
            margin: 0;
            color: #e7edf1;
            font-size: 16px;
            line-height: 1.7;
        }

        .section {
            margin-top: 34px;
        }

        .section h2 {
            margin: 0 0 14px;
            color: #111820;
            font-size: 24px;
        }

        .provider-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
        }

        .provider-link {
            display: grid;
            grid-template-columns: 42px minmax(0, 1fr) auto;
            align-items: center;
            gap: 12px;
            min-height: 58px;
            padding: 10px 12px;
            border: 1px solid #d8e0e6;
            border-radius: 8px;
            background: #ffffff;
            text-decoration: none;
            box-shadow: 0 8px 24px rgba(27, 39, 51, 0.06);
        }

        .provider-link:hover {
            border-color: #2f6f73;
            background: #eef7f6;
        }

        .provider-icon,
        .provider-fallback {
            width: 42px;
            height: 42px;
            border-radius: 8px;
        }

        .provider-icon {
            object-fit: contain;
            background: #ffffff;
        }

        .provider-fallback {
            display: grid;
            place-items: center;
            background: #26323d;
            color: #ffffff;
            font-weight: 700;
        }

        .provider-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 700;
        }

        .provider-type {
            padding: 4px 8px;
            border-radius: 999px;
            background: #e7edf1;
            color: #4c5b68;
            font-size: 12px;
            font-weight: 700;
        }

        .cast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
        }

        .cast-card {
            overflow: hidden;
            border: 1px solid #dce3e9;
            border-radius: 8px;
            background: #ffffff;
        }

        .cast-card img,
        .cast-empty {
            width: 100%;
            aspect-ratio: 2 / 3;
        }

        .cast-card img {
            display: block;
            object-fit: cover;
        }

        .cast-empty {
            display: grid;
            place-items: center;
            padding: 14px;
            background: #dfe7ec;
            color: #44515e;
            text-align: center;
            font-weight: 700;
        }

        .cast-info {
            display: grid;
            gap: 4px;
            padding: 11px;
        }

        .cast-info strong,
        .cast-info span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .cast-info span {
            color: #687785;
            font-size: 13px;
        }

        @media (max-width: 760px) {
            .hero {
                grid-template-columns: 1fr;
                min-height: 0;
                padding: 18px;
            }

            .poster,
            .poster-empty {
                width: min(260px, 100%);
            }

            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <input class="nav-toggle" id="navToggle" type="checkbox">
    <label class="nav-open" for="navToggle" aria-label="메뉴 열기">☰</label>
    <nav class="side-nav" aria-label="콘텐츠 유형">
        <a href="/contents/movies/" class="{% if media_type == 'movie' %}active{% endif %}">영화</a>
        <a href="/contents/shows/" class="{% if media_type == 'tv' %}active{% endif %}">드라마</a>
        <a href="/accounts/profile/">프로필</a>
        <a href="/accounts/google/login/">로그인</a>
    </nav>
    <label class="nav-backdrop" for="navToggle" aria-label="메뉴 닫기"></label>

    <main id="app" class="page">
        <a class="back-link" href="{{ list_url }}">목록으로 돌아가기</a>

        <p v-if="errorMessage" class="notice">[[ errorMessage ]]</p>
        <div v-if="loading" class="loader">상세 정보를 불러오는 중입니다.</div>

        <template v-if="movie && !loading">
            <section class="hero" :style="heroStyle">
                <img v-if="movie.poster_url" class="poster" :src="movie.poster_url" :alt="`${movie.title} 포스터`">
                <div v-else class="poster-empty">[[ movie.title ]]</div>

                <div class="hero-content">
                    <h1>[[ movie.title ]]</h1>
                    <div class="meta">
                        <span class="pill">[[ movie.release_date || '개봉일 미정' ]]</span>
                        <span v-if="movie.runtime" class="pill">[[ movie.runtime ]]분</span>
                        <span class="pill">평점 [[ Number(movie.rating).toFixed(1) ]]</span>
                        <span v-for="genre in movie.genres" :key="genre.id" class="pill">[[ genre.name ]]</span>
                    </div>
                    <p class="overview">[[ movie.overview ]]</p>
                </div>
            </section>

            <section class="section">
                <h2>이용 가능 서비스</h2>
                <p v-if="providers.length === 0" class="notice">현재 한국에서 이용 가능한 서비스가 없습니다.</p>
                <div v-else class="provider-grid">
                    <a
                        v-for="provider in providers"
                        :key="`${provider.service}-${provider.type}-${provider.link}`"
                        class="provider-link"
                        :href="provider.link"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        <img v-if="provider.icon_url" class="provider-icon" :src="provider.icon_url" :alt="provider.display_name || provider.service">
                        <span v-else class="provider-fallback">[[ providerInitial(provider.display_name || provider.service) ]]</span>
                        <span class="provider-name">[[ provider.display_name || provider.service ]]</span>
                        <span class="provider-type">[[ provider.type_label ]]</span>
                    </a>
                </div>
            </section>

            <section class="section">
                <h2>출연진</h2>
                <p v-if="movie.cast.length === 0" class="notice">출연진 정보가 없습니다.</p>
                <div v-else class="cast-grid">
                    <article v-for="person in movie.cast" :key="`${person.name}-${person.character}`" class="cast-card">
                        <img v-if="person.profile_url" :src="person.profile_url" :alt="person.name">
                        <div v-else class="cast-empty">[[ person.name ]]</div>
                        <div class="cast-info">
                            <strong>[[ person.name ]]</strong>
                            <span>[[ person.character || '배역 정보 없음' ]]</span>
                        </div>
                    </article>
                </div>
            </section>
        </template>
    </main>

    <script>
        const { createApp } = Vue;
        const tmdbId = '{{ tmdb_id }}';
        const detailApiUrl = '{{ detail_api_url }}';

        createApp({
            delimiters: ['[[', ']]'],
            data() {
                return {
                    movie: null,
                    providers: [],
                    loading: true,
                    errorMessage: '',
                };
            },
            computed: {
                heroStyle() {
                    const image = this.movie && this.movie.backdrop_url ? `url(${this.movie.backdrop_url})` : 'none';
                    return { '--backdrop': image };
                },
            },
            mounted() {
                this.loadDetail();
            },
            methods: {
                async loadDetail() {
                    this.loading = true;
                    this.errorMessage = '';

                    try {
                        const data = await this.requestJson(`${detailApiUrl}?debug_raw=1`);
                        console.log('[WhatSub] movie_detail response:', data);
                        console.log('[WhatSub] streaming availability original JSON:', data.raw_streaming_data);
                        this.movie = data.movie;
                        this.providers = data.providers || [];
                    } catch (error) {
                        this.errorMessage = error.message;
                    } finally {
                        this.loading = false;
                    }
                },
                async requestJson(url) {
                    const response = await fetch(url);
                    const data = await response.json().catch(() => ({}));

                    if (!response.ok) {
                        throw new Error(data.error || '요청 처리 중 문제가 발생했습니다.');
                    }

                    return data;
                },
                providerInitial(service) {
                    return (service || '?').trim().charAt(0).toUpperCase();
                },
            },
        }).mount('#app');
    </script>
</body>
</html>
