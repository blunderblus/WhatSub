# One-shot Supabase setup when local network blocks Postgres (e.g. SSAFY campus).
#
# GitHub Secret DATABASE_URL — copy EXACTLY from Supabase Dashboard:
#   Project → Connect (top) → ORM / URI → Session mode, port 5432
#   Do NOT guess aws-0 vs aws-1 pooler host; wrong host → "tenant/user not found"
#   Username must be postgres.[project-ref] (no [] brackets)
#   URL-encode special chars in password (@ → %40, etc.)
#   If URI ends with ?pgbouncer=true, settings.py strips it automatically.
#
# Local dev: keep DATABASE_URL commented in .env → SQLite

name: Seed Supabase

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Migrate and load fixtures
        env:
          DEBUG: 'True'
          SECRET_KEY: ci-temporary-secret-not-for-production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash scripts/load_seed_data.sh
