# fly.toml app configuration file generated for whatsub-api on 2026-06-25T11:46:35+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'whatsub-api'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'
  # Depot builder queue can be long on free tier. If deploy hangs, use:
  #   fly deploy --depot=false

[deploy]
  # DB schema already applied via GitHub Actions seed. Re-enable after fixing DATABASE_URL:
  # release_command = 'python manage.py migrate --noinput'

[env]
  DEBUG = 'False'
  GMAIL_PIPELINE_LOG = 'True'
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/health/"
    timeout = "5s"

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
