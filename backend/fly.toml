# Fly.io — deploy from backend/:  fly deploy
# First time: fly launch --no-deploy  (pick Tokyo / nrt, do not add Postgres)

app = 'whatsub-api'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8000'
  DEBUG = 'False'
  GMAIL_PIPELINE_LOG = 'True'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/accounts/csrf/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

[deploy]
  release_command = 'python manage.py migrate --noinput'
