<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>환영합니다 · WhatSub</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'accounts/onboarding-theme.css' %}">
    <style>
        body { display: grid; place-items: center; overflow: hidden; }
        canvas { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
        .card {
            position: relative; z-index: 20; width: min(520px, calc(100% - 32px));
            padding: 48px 36px; text-align: center;
            animation: pop 0.6s cubic-bezier(.2,1.2,.3,1) both;
        }
        @keyframes pop {
            from { opacity: 0; transform: scale(0.92) translateY(12px); }
            to { opacity: 1; transform: none; }
        }
        h1 { font-size: 32px; margin-bottom: 12px; }
        h2 { margin: 0 0 24px; font-size: 18px; font-weight: 600; color: var(--ws-muted); }
        .note {
            margin: 0 0 28px; padding: 12px 14px; border-radius: 10px;
            background: rgba(217, 221, 146, 0.08); color: var(--ws-muted); font-size: 13px; line-height: 1.5;
            border: 1px solid rgba(217, 221, 146, 0.2);
        }
        .btn { display: inline-block; padding: 14px 28px; border-radius: 10px; font-weight: 800; text-decoration: none; }
    </style>
</head>
<body>
    <canvas id="confetti"></canvas>
    <main class="card panel">
        <h1>WhatSub?에 오신 것을 환영합니다!</h1>
        <h2>함께 슬기로운 구독생활 해봐요.</h2>
        <p class="note">
            분석에 사용된 이메일 내용은 서버에 저장되지 않았으며, 스캔이 끝난 뒤 자동으로 폐기되었습니다.
        </p>
        <a class="btn cta" href="{{ frontend_url }}/subscriptions">내 대시보드로 이동</a>
    </main>
    <script>
        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d');
        let W, H, pieces = [];
        function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
        resize(); addEventListener('resize', resize);
        const colors = ['#D9DD92','#fca311','#e50914','#01137c','#00a8e1','#D9DD92','#ff6b6b'];
        for (let i = 0; i < 120; i++) {
            pieces.push({
                x: Math.random() * innerWidth, y: Math.random() * innerHeight - innerHeight,
                w: 6 + Math.random() * 8, h: 10 + Math.random() * 6,
                color: colors[i % colors.length],
                vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2,
                rot: Math.random() * 360, vr: -4 + Math.random() * 8,
            });
        }
        function frame() {
            ctx.clearRect(0, 0, W, H);
            pieces.forEach(p => {
                p.x += p.vx; p.y += p.vy; p.rot += p.vr;
                if (p.y > H + 20) { p.y = -20; p.x = Math.random() * W; }
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot * Math.PI / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                ctx.restore();
            });
            requestAnimationFrame(frame);
        }
        frame();
    </script>
</body>
</html>
